<header class="bg-white shadow sticky top-0 z-10">
  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
    <a routerLink="/" class="text-2xl font-bold text-blue-600">E-Shop</a>
    <nav class="flex items-center gap-4 text-sm">
      <a routerLink="/products" class="hover:text-blue-600">Products</a>
      <a routerLink="/cart" class="hover:text-blue-600">Cart</a>
      @if (auth.user()) {
        <a routerLink="/orders" class="hover:text-blue-600">Orders</a>
        <a routerLink="/wishlist" class="hover:text-blue-600">Wishlist</a>
        @if (auth.isAdmin) { <a routerLink="/admin" class="hover:text-blue-600">Admin</a> }
        <button (click)="auth.logout()" class="text-red-600">Logout</button>
      } @else {
        <a routerLink="/login" class="hover:text-blue-600">Login</a>
        <a routerLink="/register" class="hover:text-blue-600">Register</a>
      }
    </nav>
  </div>
</header>
<main class="max-w-7xl mx-auto px-4 py-6">
  <router-outlet />
</main>
